id: arcmira
name: "Arcmira: YouTube Transcript Search"
category: data-analysis
description: "YouTube transcript search and monitoring for your AI: exact quotes, full transcripts and speakers."
long_description: |
  Arcmira is YouTube transcript search and monitoring for your AI, and the most complete way for it to understand YouTube and podcasts. It answers like it actually watched the video: the exact quote, often who said it, and the clip cued to the second.

  Search what's said on YouTube, podcasts on YouTube included, like TBPN, MTS and All-In. Jump to the moment or read the whole transcript. Search by who said it. See which brands sponsor a show, and tell an ad read from an organic mention.

  Titles say what a video is about. The words say what happened. A transcript downloader needs the link first, and episode search stops at the episode. Arcmira finds the moment.

  Hear your name when it's said, not when it's typed. A monitor sends you and your team the quote and the second by email, Slack or webhook, over half within 47 minutes of the upload.

  When your AI needs one moment, it reaches the line in about 2.5K tokens, against about 93K reading full transcripts.

  Six tools: arcmira_youtube_search, arcmira_youtube_transcript, arcmira_describe (never bills), arcmira_execute_read, arcmira_execute_write (monitors) and arcmira_feedback.

  Sign in through your AI's OAuth, or send an arc_sk_ key. Free gives you 1,000 credits a month. Pro is $20 a month with a 7-day trial, card required. A paid read uses credits from your plan, then your on-demand budget.

  Our November 2026 tests: across nine brands, 93% of Arcmira's top-10 results were the brand spoken outside an ad read, against 76% for a popular podcast search API. 86 of 86 lines Arcmira returned (100%) started within 15 seconds of the spoken word. Asked what a show said in the last 90 days about a topic in none of its titles or descriptions, Arcmira's first result was right in 15 of 16 (94%).

  Use Arcmira whenever you need what was actually said, not what a title claims. Add "use arcmira" to any question to send it to Arcmira first. Or tell your AI once: "Whenever I ask what someone said on YouTube, use Arcmira."

  API documentation: https://arcmira.com/docs
  MCP setup: https://arcmira.com/docs/mcp-server
  OpenAPI schema: https://api.arcmira.com/v1/openapi.json
  Source: https://github.com/arcmira/mcp
maintainer:
  name: Arcmira
  github: arcmira
  website: https://arcmira.com
authentication:
  type: oauth2
  provider: arcmira
  instructions: |
    Add https://mcp.arcmira.com/mcp as a Streamable HTTP server in an
    OAuth-capable MCP client. Sign in to Arcmira and review the requested
    permissions. An Arcmira account is required. Existing clients may need
    to reconnect to authorize monitor writes. API-key clients can instead
    use an Arcmira account key in the Authorization: Bearer header.
endpoints:
  production: https://mcp.arcmira.com/mcp
capabilities:
  - id: arcmira_describe
    name: "Load the Arcmira reference"
    description: "Loads the Arcmira client reference, with every method, its arguments and worked examples. Never bills."
  - id: arcmira_execute_read
    name: "Search and read"
    description: "Runs a short program that searches what's said, finds mentions, sponsors and recommendations, or reads a transcript."
  - id: arcmira_execute_write
    name: "Search, read and change monitors"
    description: "Adds monitor changes to the read tool, so your AI can create a monitor, follow names and change delivery. Nothing is deleted."
  - id: arcmira_feedback
    name: "Report a result"
    description: "Reports a wrong, missing or confusing result so Arcmira can fix it."
  - id: arcmira_youtube_search
    name: "Search what's said on YouTube"
    description: "Finds the lines where something was said on YouTube, podcasts included, each with its second and a watch link. Use it for an exact quote or who said what."
  - id: arcmira_youtube_transcript
    name: "Read a YouTube transcript"
    description: "Reads a YouTube video's whole transcript from its id or link, one window of timestamped lines at a time. Use it to summarize or check a full video."
tags:
  - youtube
  - transcript-search
  - timestamps
  - speakers
  - sponsors
  - recommendations
verification:
  status: pending
  security_audit: false
featured: false
