id: ca-river-levels-mcp
name: Canada River Levels & Flood Watch MCP
category: data-analysis
description: Real-time river and lake levels from Water Survey of Canada gauges near any postal code
long_description: |
  Real-time river and lake levels from Water Survey of Canada gauges near any postal code. Free river_levels (no key); Pro C$15/mo.
  Part of the UK MCP data fleet: https://github.com/donniertf-hub/uk-mcp-fleet
maintainer:
  name: Donnie Morrison
  github: donniertf-hub
  website: https://github.com/donniertf-hub/uk-mcp-fleet
authentication:
  type: none
  provider: none
  instructions: |
    No authentication required for the free tool. Pro tools need a bearer token
    from a Stripe subscription (see https://ca-river-levels-mcp.donniertf.workers.dev/pricing.json).
endpoints:
  production: https://ca-river-levels-mcp.donniertf.workers.dev/mcp
capabilities:
  - id: ca-river-levels.free
    name: Free check
    description: Real-time river and lake levels from Water Survey of Canada gauges near any postal code
tags:
  - canada
  - open-data
  - remote
