category: data-analysis
description: Is this medical device licensed for sale in Canada? Search Health Canada's MDALL by trade name and verify licences in bulk from your AI agent
long_description: |
  Is this medical device licensed for sale in Canada? Search Health Canada's MDALL by trade name and verify licences in bulk from your AI agent. Free device_search (no key); Pro C$15/mo.
