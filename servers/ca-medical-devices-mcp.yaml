  github: donniertf-hub
  website: https://github.com/donniertf-hub/uk-mcp-fleet
authentication:
  type: none
  provider: none
  instructions: |
    No authentication required for the free tool. Pro tools need a bearer token
    from a Stripe subscription (see https://ca-medical-devices-mcp.donniertf.workers.dev/pricing.json).
endpoints:
