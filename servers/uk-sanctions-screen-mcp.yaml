id: uk-sanctions-screen-mcp
name: UK Sanctions Screening MCP
category: security
description: Screen people and companies against the UK Sanctions List (FCDO/OFSI, OGL)
long_description: |
  Screen people and companies against the UK Sanctions List (FCDO/OFSI, OGL). Free sanctions_check (no key); Pro £19/month adds batch screening of 200 names and audit-ready output.
  Part of the UK MCP data fleet: https://github.com/donniertf-hub/uk-mcp-fleet
maintainer:
  name: Donnie Morrison
  github: donniertf-hub
  website: https://github.com/donniertf-hub/uk-mcp-fleet
authentication:
  type: none
  provider: none
  instructions: |
    No authentication required for the free tool. Pro tools need a bearer token
    from a Stripe subscription (see https://uk-sanctions-screen-mcp.donniertf.workers.dev/pricing.json).
endpoints:
  production: https://uk-sanctions-screen-mcp.donniertf.workers.dev/mcp
capabilities:
