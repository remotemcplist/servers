id: dchub-mcp
name: DC Hub
category: data-analysis

description: Orchestration layer for data center and energy intelligence (start with execute_plan). Data Center Power Index (DCPI), power-grid, fiber and site-selection tools — 97 MCP tools. DCHUB_API_KEY is optional.
long_description: |
  DC Hub is the orchestration layer for data center and energy intelligence:
  start with execute_plan. Agents can query power, grid, gas and fiber layers,
  score sites, and pull market context across 97 tools. Endpoint:
  https://dchub.cloud/mcp (streamable HTTP). DCHUB_API_KEY is optional. Source:
  https://github.com/azmartone67/dchub-mcp-server. Official registry name:
  cloud.dchub/mcp-server.

maintainer:
  name: DC Hub
  github: azmartone67
  website: https://dchub.cloud

authentication:
  type: none
  provider: none
  instructions: |
    DCHUB_API_KEY is optional. Connect with no auth to https://dchub.cloud/mcp,
    or set header X-API-Key from https://dchub.cloud/connect.

endpoints:
  production: https://dchub.cloud/mcp

capabilities:
  - id: search.facilities
    name: Search facilities
    description: Search the global data-center facility map by location, provider, power, and fiber
  - id: site.selection
    name: Site selection and scoring
    description: Score sites on power, grid, fiber, water, risk, and workforce
  - id: grid.energy
    name: Grid and energy intelligence
    description: ISO/grid context, energy prices, interconnection queue, and gas economics
  - id: market.intel
    name: Market and M&A intelligence
    description: Market stats, deals, news, and capacity pipeline

tags:
  - data-center
  - energy
  - power-grid
  - fiber
  - site-selection
  - remote
  - mcp

verification:
  status: pending
  tested_date: "2026-09-24T00:00:00Z"
  security_audit: false

featured: false
