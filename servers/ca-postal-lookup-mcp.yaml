id: ca-postal-lookup-mcp
name: Canada Postal Code Lookup MCP
category: data-analysis
description: Resolve Canadian postal codes to city, province and coordinates
long_description: |
  Resolve Canadian postal codes to city, province and coordinates. Free postal_lookup (no key); Pro C$9/mo.
  Part of the UK MCP data fleet: https://github.com/donniertf-hub/uk-mcp-fleet
maintainer:
  name: Donnie Morrison
  github: donniertf-hub
  website: https://github.com/donniertf-hub/uk-mcp-fleet
authentication:
  type: none
  provider: none
  instructions: |
    No authentication required for the free tool. Pro tools need a bearer token
    from a Stripe subscription (see https://ca-postal-lookup-mcp.donniertf.workers.dev/pricing.json).
endpoints:
  production: https://ca-postal-lookup-mcp.donniertf.workers.dev/mcp
capabilities:
  - id: ca-postal-lookup.free
    name: Free check
    description: Resolve Canadian postal codes to city, province and coordinates
tags:
  - canada
  - open-data
  - remote
